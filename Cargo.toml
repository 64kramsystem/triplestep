[package]
name = "triplestep"
version = "0.1.0"
edition = "2024"
description = "TripleStep: a small GUI for testing three-part beats"
repository = "https://github.com/64kramsystem/triplestep"

[dependencies]
dirs = "6"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
egui_kittest = { version = "0.36", default-features = false }
tempfile = "3"
